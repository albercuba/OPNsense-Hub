    <path d="M239.00,105.81 A34,34 0 0 1 273.00,105.81 L377.56,166.19 A34,34 0 0 1 394.56,195.63 L394.56,316.37 A34,34 0 0 1 377.56,345.81 L273.00,406.19 A34,34 0 0 1 239.00,406.19 L134.44,345.81 A34,34 0 0 1 117.44,316.37 L117.44,195.63 A34,34 0 0 1 134.44,166.19 Z" fill="none" stroke="url(#rim)" stroke-width="6"/>
  </g>

