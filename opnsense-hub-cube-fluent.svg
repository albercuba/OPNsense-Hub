<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">OPNsense-Hub cube (Fluent style)</title>
  <desc id="d">An isometric teal cube in a Fluent 2 style: soft rounded silhouette, teal gradients, light edge highlights, a white line-art firewall (brick wall with a flame) on the left face and a white line-art hub on the right face: one central node linked to six surrounding nodes, each connected only to the centre.</desc>

  <defs>
    <clipPath id="sil"><path d="M239.00,105.81 A34,34 0 0 1 273.00,105.81 L377.56,166.19 A34,34 0 0 1 394.56,195.63 L394.56,316.37 A34,34 0 0 1 377.56,345.81 L273.00,406.19 A34,34 0 0 1 239.00,406.19 L134.44,345.81 A34,34 0 0 1 117.44,316.37 L117.44,195.63 A34,34 0 0 1 134.44,166.19 Z"/></clipPath>

    <!-- Fluent-style teal ramp -->
    <linearGradient id="gTop" gradientUnits="userSpaceOnUse" x1="117.44" y1="96.00" x2="394.56" y2="256.00">
      <stop offset="0" stop-color="#A6EDE0"/>
      <stop offset="1" stop-color="#46CDB9"/>
    </linearGradient>
    <linearGradient id="gLeft" gradientUnits="userSpaceOnUse" x1="117.44" y1="176.00" x2="256.00" y2="416.00">
      <stop offset="0" stop-color="#178F82"/>
      <stop offset="1" stop-color="#0A6B62"/>
    </linearGradient>
    <linearGradient id="gRight" gradientUnits="userSpaceOnUse" x1="394.56" y1="176.00" x2="256.00" y2="416.00">
      <stop offset="0" stop-color="#0A5750"/>
      <stop offset="1" stop-color="#06322F"/>
    </linearGradient>

    <!-- soft gloss on the top face -->
    <linearGradient id="gloss" gradientUnits="userSpaceOnUse" x1="256.00" y1="96.00" x2="256.00" y2="256.00">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- rim light: bright on the top-left, fading out toward the bottom-right -->
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="117.44" y1="96.00" x2="394.56" y2="416.00">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

  </defs>

