    <polygon id="top"   points="256.00,96.00 394.56,176.00 256.00,256.00 117.44,176.00" fill="url(#gTop)"/>
    <polygon points="256.00,96.00 394.56,176.00 256.00,256.00 117.44,176.00" fill="url(#gloss)"/>

